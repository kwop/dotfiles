# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []


# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 0

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["1", "2", "3", "4","5"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode÷
on-mode-changed = []

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[workspace-to-monitor-force-assignment]
1 = 'secondary'        
2 = 'main'
3 = 'main'   
4 = 'main'
5 = 'secondary'
[gaps]

    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        10
     outer.right =        10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]
alt-f = 'fullscreen'
# Reconstruit le workspace 1 en deux accordéons verticaux (gauche/droite)
alt-shift-a = 'exec-and-forget ~/.config/aerospace/two-accordions.sh --force'
# Reconstruit le workspace 2 en un seul accordéon vertical plein écran
alt-shift-z = 'exec-and-forget ~/.config/aerospace/single-accordion.sh --force 2'
alt-shift-q = 'layout v_accordion'
alt-shift-t = 'layout h_tiles'
alt-shift-s = 'split horizontal'
ctrl-cmd-left  = 'join-with left'
ctrl-cmd-down  = 'join-with down'
ctrl-cmd-up    = 'join-with up'
ctrl-cmd-right = 'join-with right'
    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-shift-up = ['split horizontal', 'layout accordion']
ctrl-shift-left = 'layout accordion horizontal'
ctrl-shift-right = 'layout accordion vertical'
    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    ctrl-alt-cmd-left = 'focus left'
    ctrl-alt-cmd-down = 'focus down'
    ctrl-alt-cmd-up = 'focus up'
    ctrl-alt-cmd-right = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
 

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    # ctrl-alt-cmd : alt seul volait '}' (Option+)) sur AZERTY Mac, et
    # ctrl-alt entrait en conflit avec le resize des panes Zellij.
    # Positions QWERTY -> AZERTY : 'equal' = touche '-', 'slash' = touche '='.
    ctrl-alt-cmd-equal = 'resize smart -50'
    ctrl-alt-cmd-slash = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'


    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    # ctrl-alt-shift (et non alt-shift) : sur clavier AZERTY Mac, alt-shift-5
    # = Option+Maj+( et volait le crochet '['.
    ctrl-alt-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-right = 'exec-and-forget aerospace list-workspaces --all | aerospace workspace --wrap-around --stdin next'
alt-shift-left = 'exec-and-forget aerospace list-workspaces --all | aerospace workspace --wrap-around --stdin prev'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    #alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-tab = 'mode service'


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

   # ctrl-shift-left = ['join-with left', 'mode main']
    # ctrl-shift-down = ['join-with down', 'mode main']
   # ctrl-shift-up = ['join-with up', 'mode main']
   # ctrl-shift-right = ['join-with right', 'mode main']

# Petites fenêtres système (alertes LuLu, demandes d'autorisation, mot de passe
# admin, avertissement Gatekeeper, Réglages Système) : flottantes, sur le
# workspace courant, sans aucune réorganisation. Ces règles doivent rester
# AVANT les autres : seule la première règle qui correspond s'applique.
[[on-window-detected]]
if.app-id = 'com.objective-see.lulu.app'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.UserNotificationCenter'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SecurityAgent'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.coreservices.uiagent'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.accessibility.universalAccessAuthWarn'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Workspace 1 : les fenêtres sont rangées en deux accordéons verticaux
# (gauche/droite) par le script two-accordions.sh, qui décide aussi de la
# colonne selon l'application. Surtout ne pas remettre 'layout h_tiles' ici :
# cela transformerait l'accordéon vertical en tuiles horizontales.
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace 1', 'exec-and-forget ~/.config/aerospace/two-accordions.sh']

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = 'move-node-to-workspace 5'

# Workspace 2 : toutes les fenêtres dans UN seul accordéon vertical plein
# écran (pas de côte à côte). Le script aplatit l'arbre puis applique
# v_accordion à la racine à chaque nouvelle fenêtre.
[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = ['move-node-to-workspace 2', 'exec-and-forget ~/.config/aerospace/single-accordion.sh 2']

[[on-window-detected]]
if.app-id = 'com.jetbrains.datagrip'
run = ['move-node-to-workspace 2', 'exec-and-forget ~/.config/aerospace/single-accordion.sh 2']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace 2', 'exec-and-forget ~/.config/aerospace/single-accordion.sh 2']

[[on-window-detected]]
if.app-id = 'com.google.android.studio'
run = ['move-node-to-workspace 2', 'exec-and-forget ~/.config/aerospace/single-accordion.sh 2']


 

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 3' 

[[on-window-detected]]
if.app-id = 'com.electron.kontena-lens'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = ['layout h_tiles', 'move-node-to-workspace 4']  

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['layout h_tiles', 'move-node-to-workspace 4']  

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['layout h_tiles', 'move-node-to-workspace 4']  

