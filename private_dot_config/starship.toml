add_newline = true

format = "[[](bold black bg:blue) $directory ](bg:blue)[[](bold bright-white bg:black) $git_branch$git_status ](bg:black)$line_break$character"
# Couleurs : noms ANSI (pas de #hex) pour suivre le thème du terminal (Ghostty).
# Partie droite (utilisateur courant) : RPROMPT dans ~/.config/zsh/50-prompt.zsh
[directory]
format = " [ ](bold black bg:blue)[ $path]($style)"
style = "bold black bg:blue"
# Dossier courant + 3 dossiers au-dessus. truncate_to_repo couperait à la racine
# du repo (seulement « …/hmrkt » à la racine de hmrkt).
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "

[git_branch]
format = " [ ](bold cyan bg:black)[ $branch]($style)"
style = "bold purple bg:black"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "bold bright-white bg:black"
staged = " [+${count} staged](bold green bg:black)"
modified = " [~${count} modified](bold yellow bg:black)"
untracked = " [?${count} untracked](bold bright-white bg:black)"
deleted = " [-${count} deleted](bold red bg:black)"
renamed = " [»${count} renamed](bold cyan bg:black)"
stashed = ""
ahead = " [⇡${count} ahead](bold green bg:black)"
behind = " [⇣${count} behind](bold red bg:black)"
diverged = " [⇕${count} diverged](bold red bg:black)"
conflicted = " [!${count} conflicted](bold red bg:black)"